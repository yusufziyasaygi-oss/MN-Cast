      - name: Download FFmpeg essentials
        shell: powershell
        run: |
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile 'ffmpeg.zip'
          Expand-Archive -Path 'ffmpeg.zip' -DestinationPath 'ffmpeg' -Force
          $ff = Get-ChildItem -Path 'ffmpeg' -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $ff) { throw 'ffmpeg.exe bulunamadi' }
          Copy-Item $ff.FullName '.\ffmpeg.exe'
          Write-Host "FFmpeg: $($ff.FullName)"

      - name: Embed FFmpeg and compile EXE
        shell: cmd
        run: |
          echo 101 RCDATA "ffmpeg.exe" > resource.rc
          rc.exe /nologo /fo resource.res resource.rc
          cl.exe /nologo /std:c++20 /O2 /EHsc /MT /DUNICODE /D_UNICODE mncast_windows_sender.cpp resource.res /link /SUBSYSTEM:WINDOWS /OUT:MN-Cast-Windows.exe ws2_32.lib ole32.lib user32.lib gdi32.lib shell32.lib uuid.lib

      - name: SHA256
        shell: powershell
        run: |
          (Get-FileHash '.\MN-Cast-Windows.exe' -Algorithm SHA256).Hash.ToLower() | Set-Content '.\MN-Cast-Windows.sha256'
          Get-Item '.\MN-Cast-Windows.exe' | Format-List Name,Length
          Get-Content '.\MN-Cast-Windows.sha256'

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MN-Cast-Windows
          path: |
            MN-Cast-Windows.exe
            MN-Cast-Windows.sha256
          if-no-files-found: error
          retention-days: 90
